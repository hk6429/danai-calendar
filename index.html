<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大乃日曆</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="大乃日曆">
<meta name="theme-color" content="#f6f1e7"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head><body>
<main id="card">
  <header class="date" aria-live="polite"><div class="big"><span id="mon"></span><span id="day"></span></div><div id="wd" class="wd"></div></header>
  <p class="sub"><span id="lunar"></span><span class="dot">·</span><span id="term"></span><span id="holiday" class="tag" hidden></span></p>
  <figure class="scene"><div id="particles" aria-hidden="true"></div><button id="mascot-btn" type="button" aria-label="切換今天、明天、昨天"><img id="mascot" alt="今日場景" decoding="async"></button></figure>
  <button id="quote" class="quote" type="button" aria-label="換一句，長按複製"><p id="qtext"></p><footer id="qmeta"></footer></button>
  <div id="toast" class="toast" role="status" hidden>已複製</div>
</main>
<script src="js/vendor/lunar.js"></script>
<script type="module" src="js/app.js"></script>
</body></html>
